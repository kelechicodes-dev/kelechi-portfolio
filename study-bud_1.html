<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelechi Study Bud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-a: #0d1b2a;
    --bg-b: #16283b;
    --surface: rgba(255,255,255,0.05);
    --surface-strong: rgba(255,255,255,0.10);
    --line: rgba(255,255,255,0.12);
    --text: #f4f1ea;
    --text-dim: #9fb0c3;
    --lamp: #ffb668;
    --lamp-soft: rgba(255,182,104,0.35);
    --calm: #7fd8c9;
    --font-display: 'Fraunces', serif;
    --font-body: 'Lexend', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  body {
    min-height: 100vh;
    font-family: var(--font-body);
    color: var(--text);
    background: linear-gradient(160deg, var(--bg-a), var(--bg-b));
    display: flex;
    justify-content: center;
    padding: 32px 18px 60px;
  }

  .app { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 22px; }

  /* ---------- HEADER ---------- */
  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 10px var(--lamp); }
  .brand-name { font-family: var(--font-display); font-weight: 600; font-size: 20px; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-dim); font-size: 16px;
  }
  .icon-btn:hover { background: var(--surface-strong); color: var(--text); }

  /* ---------- MOTIVATION BANNER ---------- */
  .motivation {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 16px; font-size: 13px; color: var(--text-dim);
    display: flex; align-items: center; gap: 10px;
  }
  .motivation .spark { color: var(--lamp); flex-shrink: 0; }

  /* ---------- LAMP ORB ---------- */
  .orb-stage { display: flex; flex-direction: column; align-items: center; padding: 20px 0 6px; }
  .orb-wrap { position: relative; width: 180px; height: 180px; }
  .orb-glow {
    position: absolute; inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--lamp-soft) 0%, transparent 70%);
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.08); opacity: 1; } }
  .orb {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd9a8, var(--lamp) 55%, #d98f3e 100%);
    box-shadow: 0 0 40px var(--lamp-soft), inset 0 -10px 30px rgba(0,0,0,0.25);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease;
  }
  .orb:active { transform: scale(0.96); }
  .orb.listening { animation: pulse-listen 1.1s ease-in-out infinite; }
  @keyframes pulse-listen { 0%, 100% { box-shadow: 0 0 40px var(--lamp-soft), inset 0 -10px 30px rgba(0,0,0,0.25); } 50% { box-shadow: 0 0 70px var(--lamp), inset 0 -10px 30px rgba(0,0,0,0.25); } }
  .orb.speaking { animation: pulse-speak 0.6s ease-in-out infinite; }
  @keyframes pulse-speak { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  .orb-icon { font-size: 44px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
  .orb-status { margin-top: 16px; font-size: 13px; color: var(--text-dim); font-weight: 500; letter-spacing: 0.02em; }

  /* ---------- INPUT ROW ---------- */
  .input-row { display: flex; gap: 8px; }
  .input-row input[type="text"] {
    flex: 1;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 16px; color: var(--text); font-family: var(--font-body); font-size: 15px;
  }
  .input-row input:focus { outline: none; border-color: var(--lamp); }
  .send-btn, .scan-btn {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 0 16px; color: var(--text); cursor: pointer; font-size: 16px;
  }
  .send-btn:hover, .scan-btn:hover { background: var(--surface-strong); }

  /* ---------- MODE ROW ---------- */
  .mode-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .mode-chip {
    font-size: 12px; font-weight: 600; padding: 7px 13px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); color: var(--text-dim);
    cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .mode-chip.active { background: var(--calm); color: #06231d; border-color: var(--calm); }
  .mode-chip:hover:not(.active) { background: var(--surface-strong); }

  /* ---------- CHAT LOG ---------- */
  .chat-log { display: flex; flex-direction: column; gap: 12px; }
  .bubble { max-width: 84%; padding: 12px 15px; border-radius: 14px; font-size: 14.5px; line-height: 1.5; }
  .bubble.user { align-self: flex-end; background: var(--calm); color: #06231d; border-bottom-right-radius: 4px; }
  .bubble.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bubble .meta { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; margin-bottom: 4px; }
  .empty-chat { text-align: center; color: var(--text-dim); font-size: 13px; padding: 30px 10px; }

  /* ---------- SETTINGS PANEL ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px;
    display: none; flex-direction: column; gap: 14px;
  }
  .panel.open { display: flex; }
  .panel-row { display: flex; align-items: center; justify-content: space-between; }
  .panel-row label { font-size: 13px; color: var(--text-dim); font-weight: 500; }
  select {
    background: rgba(0,0,0,0.2); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); padding: 7px 10px; font-family: var(--font-body); font-size: 13px;
  }
  .toggle {
    width: 40px; height: 22px; border-radius: 999px; background: rgba(255,255,255,0.15);
    position: relative; cursor: pointer; border: none;
  }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--text); transition: transform 0.2s ease;
  }
  .toggle.on { background: var(--calm); }
  .toggle.on::after { transform: translateX(18px); background: #06231d; }

  /* ---------- SAVED CONVERSATIONS ---------- */
  .saved-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
  .saved-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: rgba(0,0,0,0.18); border-radius: 8px; padding: 9px 11px; font-size: 12.5px;
    cursor: pointer;
  }
  .saved-item:hover { background: rgba(0,0,0,0.28); }
  .saved-item .del { color: var(--text-dim); background: none; border: none; cursor: pointer; font-size: 14px; }
  .saved-item .del:hover { color: #ff8080; }

  footer { text-align: center; color: var(--text-dim); font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <div class="brand-dot"></div>
      <div class="brand-name">Kelechi Study Bud</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="savedBtn" title="Saved conversations">🗂</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </header>

  <div class="motivation" id="motivationBanner">
    <span class="spark">✦</span>
    <span id="motivationText">Every page you read tonight is one your future self doesn't have to.</span>
  </div>

  <div class="panel" id="savedPanel">
    <div class="panel-row"><label>Saved conversations</label></div>
    <div class="saved-list" id="savedList"></div>
  </div>

  <div class="panel" id="settingsPanel">
    <div class="panel-row">
      <label>Reply language</label>
      <select id="languageSelect">
        <option value="en-US">English</option>
        <option value="fr-FR">French</option>
        <option value="es-ES">Spanish</option>
        <option value="ig-NG">Igbo</option>
        <option value="yo-NG">Yoruba</option>
        <option value="ha-NG">Hausa</option>
      </select>
    </div>
    <div class="panel-row">
      <label>Calm background sound</label>
      <button class="toggle" id="calmToggle"></button>
    </div>
    <div class="panel-row">
      <label>Speak replies aloud</label>
      <button class="toggle" id="voiceToggle"></button>
    </div>
  </div>

  <div class="orb-stage">
    <div class="orb-wrap">
      <div class="orb-glow"></div>
      <button class="orb" id="orbBtn">
        <span class="orb-icon" id="orbIcon">🎙</span>
      </button>
    </div>
    <div class="orb-status" id="orbStatus">Tap to ask a question</div>
  </div>

  <div class="mode-row">
    <button class="mode-chip active" id="chatModeBtn">💬 Chat</button>
    <button class="mode-chip" id="quizModeBtn">📝 Quiz mode</button>
  </div>

  <div class="input-row">
    <input type="text" id="textInput" placeholder="Or type your question..." />
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" />
    <button class="scan-btn" id="scanBtn" title="Scan a note">📷</button>
    <button class="send-btn" id="sendBtn">Send</button>
  </div>

  <div class="chat-log" id="chatLog">
    <div class="empty-chat" id="emptyChat">Ask about a topic, paste a chapter to summarize, or scan a note to get started.</div>
  </div>

  <footer>Conversations are saved on this device only.</footer>
</div>

<script>
  // ============ CONFIG ============
  // Once your free backend (Cloudflare Worker) is ready, paste its URL here.
  // Until then, Study Bud will explain that it's not connected yet.
  const BACKEND_URL = "https://studybud-api.clintonihejieto1.workers.dev";

  // ============ STATE ============
  const STORAGE_KEY = 'studybud_conversations_v1';
  let currentConversation = [];
  let quizMode = false;
  let voiceOn = true;
  let calmOn = false;
  let recognition = null;
  let isListening = false;
  let audioCtx = null;
  let calmNodes = null;

  const motivationLines = [
    "Every page you read tonight is one your future self doesn't have to.",
    "You don't need to feel ready. You just need to start the next sentence.",
    "Small consistent study beats last-minute panic, every time.",
    "Confusion is just the feeling right before understanding clicks.",
    "You've already come further than the version of you who almost gave up.",
  ];

  function rotateMotivation() {
    const el = document.getElementById('motivationText');
    el.textContent = motivationLines[Math.floor(Math.random() * motivationLines.length)];
  }
  setInterval(rotateMotivation, 25000);

  // ============ CHAT RENDERING ============
  function renderChat() {
    const log = document.getElementById('chatLog');
    const empty = document.getElementById('emptyChat');
    log.innerHTML = '';
    if (currentConversation.length === 0) {
      log.appendChild(empty);
      return;
    }
    currentConversation.forEach((msg) => {
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (msg.role === 'user' ? 'user' : 'assistant');
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = msg.role === 'user' ? 'You' : 'Study Bud';
      const body = document.createElement('div');
      body.textContent = msg.text;
      bubble.appendChild(meta);
      bubble.appendChild(body);
      log.appendChild(bubble);
    });
    log.scrollTop = log.scrollHeight;
  }

  function addMessage(role, text) {
    currentConversation.push({ role, text, ts: Date.now() });
    renderChat();
    saveCurrentConversation();
  }

  // ============ AI CALL ============
  async function askStudyBud(prompt, imageBase64) {
    setOrbState('thinking');
    if (!BACKEND_URL) {
      const msg = "I'm not connected to my brain yet! Kelechi needs to set up a free backend (a Cloudflare Worker + Gemini API key) and paste the URL into this file before I can actually answer questions.";
      addMessage('assistant', msg);
      if (voiceOn) speak(msg);
      setOrbState('idle');
      return;
    }
    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt,
          image: imageBase64 || null,
          language: document.getElementById('languageSelect').value,
          quizMode,
        }),
      });
      const data = await res.json();
      const reply = data.reply || "Sorry, I couldn't get a response just now.";
      addMessage('assistant', reply);
      if (voiceOn) speak(reply);
    } catch (err) {
      const msg = "Something went wrong reaching the backend. Try again in a moment.";
      addMessage('assistant', msg);
      if (voiceOn) speak(msg);
    }
    setOrbState('idle');
  }

  function handleAsk(text) {
    if (!text || !text.trim()) return;
    addMessage('user', text.trim());
    askStudyBud(text.trim());
  }

  // ============ ORB STATES ============
  function setOrbState(state) {
    const orb = document.getElementById('orbBtn');
    const icon = document.getElementById('orbIcon');
    const status = document.getElementById('orbStatus');
    orb.classList.remove('listening', 'speaking');
    if (state === 'listening') {
      orb.classList.add('listening');
      icon.textContent = '👂';
      status.textContent = 'Listening...';
    } else if (state === 'thinking') {
      icon.textContent = '💭';
      status.textContent = 'Thinking...';
    } else if (state === 'speaking') {
      orb.classList.add('speaking');
      icon.textContent = '🔊';
      status.textContent = 'Speaking...';
    } else {
      icon.textContent = '🎙';
      status.textContent = 'Tap to ask a question';
    }
  }

  // ============ VOICE INPUT ============
  function setupRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR();
    r.continuous = false;
    r.interimResults = false;
    r.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      handleAsk(transcript);
    };
    r.onend = () => { isListening = false; setOrbState('idle'); };
    r.onerror = () => { isListening = false; setOrbState('idle'); };
    return r;
  }

  document.getElementById('orbBtn').addEventListener('click', () => {
    if (!recognition) recognition = setupRecognition();
    if (!recognition) {
      alert('Voice input is not supported in this browser. Try Chrome, or type your question instead.');
      return;
    }
    if (isListening) {
      recognition.stop();
      isListening = false;
      setOrbState('idle');
      return;
    }
    recognition.lang = document.getElementById('languageSelect').value;
    recognition.start();
    isListening = true;
    setOrbState('listening');
  });

  // ============ VOICE OUTPUT ============
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = document.getElementById('languageSelect').value;
    utter.onstart = () => setOrbState('speaking');
    utter.onend = () => setOrbState('idle');
    window.speechSynthesis.speak(utter);
  }

  // ============ TEXT INPUT ============
  document.getElementById('sendBtn').addEventListener('click', () => {
    const input = document.getElementById('textInput');
    handleAsk(input.value);
    input.value = '';
  });
  document.getElementById('textInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      handleAsk(e.target.value);
      e.target.value = '';
    }
  });

  // ============ CAMERA SCAN ============
  document.getElementById('scanBtn').addEventListener('click', () => {
    document.getElementById('cameraInput').click();
  });
  document.getElementById('cameraInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      addMessage('user', '📷 Scanned a note');
      askStudyBud('Please read and explain this note.', base64);
    };
    reader.readAsDataURL(file);
  });

  // ============ QUIZ MODE ============
  document.getElementById('quizModeBtn').addEventListener('click', () => {
    quizMode = true;
    document.getElementById('quizModeBtn').classList.add('active');
    document.getElementById('chatModeBtn').classList.remove('active');
    document.getElementById('textInput').placeholder = 'What topic should I quiz you on?';
  });
  document.getElementById('chatModeBtn').addEventListener('click', () => {
    quizMode = false;
    document.getElementById('chatModeBtn').classList.add('active');
    document.getElementById('quizModeBtn').classList.remove('active');
    document.getElementById('textInput').placeholder = 'Or type your question...';
  });

  // ============ PANELS ============
  document.getElementById('settingsBtn').addEventListener('click', () => {
    document.getElementById('settingsPanel').classList.toggle('open');
    document.getElementById('savedPanel').classList.remove('open');
  });
  document.getElementById('savedBtn').addEventListener('click', () => {
    document.getElementById('savedPanel').classList.toggle('open');
    document.getElementById('settingsPanel').classList.remove('open');
    renderSavedList();
  });

  // ============ TOGGLES ============
  function setToggle(el, on) { el.classList.toggle('on', on); }

  document.getElementById('voiceToggle').addEventListener('click', (e) => {
    voiceOn = !voiceOn;
    setToggle(e.target, voiceOn);
  });
  setToggle(document.getElementById('voiceToggle'), voiceOn);

  document.getElementById('calmToggle').addEventListener('click', (e) => {
    calmOn = !calmOn;
    setToggle(e.target, calmOn);
    if (calmOn) startCalmSound(); else stopCalmSound();
  });

  // ============ CALM AMBIENT SOUND (synthesized, no external files) ============
  function startCalmSound() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.type = 'sine'; osc1.frequency.value = 110;
    osc2.type = 'sine'; osc2.frequency.value = 165;
    gain.gain.value = 0.025;
    osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
    osc1.start(); osc2.start();
    calmNodes = { osc1, osc2, gain };
  }
  function stopCalmSound() {
    if (!audioCtx) return;
    calmNodes.osc1.stop(); calmNodes.osc2.stop();
    audioCtx.close();
    audioCtx = null; calmNodes = null;
  }

  // ============ SAVED CONVERSATIONS ============
  function loadAllConversations() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveAllConversations(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }
  function saveCurrentConversation() {
    if (currentConversation.length === 0) return;
    const all = loadAllConversations();
    const title = currentConversation[0].text.slice(0, 40);
    const existingIdx = all.findIndex((c) => c.id === currentConvId);
    const record = { id: currentConvId, title, messages: currentConversation, updated: Date.now() };
    if (existingIdx >= 0) all[existingIdx] = record; else all.unshift(record);
    saveAllConversations(all.slice(0, 30));
  }
  let currentConvId = 'c_' + Date.now();

  function renderSavedList() {
    const listEl = document.getElementById('savedList');
    listEl.innerHTML = '';
    const all = loadAllConversations();
    if (all.length === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'color:var(--text-dim);font-size:12px;text-align:center;padding:10px;';
      empty.textContent = 'No saved conversations yet.';
      listEl.appendChild(empty);
      return;
    }
    all.forEach((conv) => {
      const row = document.createElement('div');
      row.className = 'saved-item';
      const label = document.createElement('span');
      label.textContent = conv.title || 'Untitled';
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '✕';
      del.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const updated = loadAllConversations().filter((c) => c.id !== conv.id);
        saveAllConversations(updated);
        renderSavedList();
      });
      row.appendChild(label);
      row.appendChild(del);
      row.addEventListener('click', () => {
        currentConvId = conv.id;
        currentConversation = conv.messages;
        renderChat();
        document.getElementById('savedPanel').classList.remove('open');
      });
      listEl.appendChild(row);
    });
  }

  // ============ INIT ============
  renderChat();
</script>

</body>
</html>
